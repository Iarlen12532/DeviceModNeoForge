name: Build TOS Mod

# Roda automaticamente a cada push/PR na branch principal, e também dá pra rodar manualmente
# na aba "Actions" do GitHub (botão "Run workflow").
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar Java 21 (exigido pelo NeoForge 1.21.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # O projeto ainda não tem o Gradle Wrapper (gradlew) gerado, então instalamos o
      # Gradle diretamente aqui no CI em vez de depender de um arquivo que não existe
      # no repositório. Assim que o wrapper for gerado (ver README), dá pra trocar essa
      # etapa + o passo de baixo por "run: ./gradlew build".
      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar o mod
        run: gradle build --stacktrace

      # Deixa o .jar final disponível pra download na própria página do Actions,
      # em "Summary" -> "Artifacts", sem precisar compilar nada localmente.
      - name: Publicar o .jar compilado
        uses: actions/upload-artifact@v4
        with:
          name: tosmod-jar
          path: build/libs/*.jar
          if-no-files-found: error
