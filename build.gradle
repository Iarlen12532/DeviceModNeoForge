plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.+'
}

version = '0.1.0-phase1'
group = 'com.tos.tosmod'

base {
    archivesName = 'tosmod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Repositórios extra (necessário mais pra frente pra LuaJ na Fase 3)
repositories {
    mavenCentral()
    // Repositório do próprio NeoForge - sem isso, a dependência "net.neoforged:neoforge"
    // não é encontrada (esse foi o erro real do build: "Could not find any version that
    // matches net.neoforged:neoforge:21.1.+").
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
}

// O bloco "runs" (pra testar o mod localmente com `gradle runClient`) foi removido daqui
// de propósito - a sintaxe exata do DSL de "runs" varia entre versões do NeoGradle e
// estava causando erro na compilação do CI (logLevel não existe nessa versão, e o tipo
// de run "client" precisa ser registrado de um jeito diferente). Como o GitHub Actions só
// precisa gerar o .jar (não rodar o jogo), tirei isso do caminho por enquanto. Se quiser
// rodar o mod localmente pelo Gradle no futuro, a sintaxe certa depende da versão exata
// do NeoGradle - melhor conferir a documentação/exemplos oficiais na hora.

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Versão fixa (não "21.1.+") - o resolvedor de versão dinâmica estava se perdendo com
    // a lista de versões mais recentes do NeoForge (muito mais novas, de outra linha do
    // Minecraft) que também aparecem no mesmo repositório. Uma versão exata e conhecida
    // pra 1.21.1 evita esse problema de resolução por completo.
    implementation "net.neoforged:neoforge:21.1.72"

    // LuaJ - interpretador Lua 100% em Java (sem JNI/biblioteca nativa), usado no terminal do TOS.
    implementation 'org.luaj:luaj-jse:3.0.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.21.1',
            neo_version      : '21.1.72',
            mod_id           : 'tosmod',
            mod_name         : 'TOS Mod',
            mod_version      : project.version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
